<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <header class="head">
            <h1>My Dashboard</h1>
            <p>Welcome back!</p>
        </header>


        <aside class="side">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>


        <main class="main">

            <h2>Overview</h2>

            <div class="boxes">

                <div class="box">
                    <span class="icon">📊</span>
                    <div>
                        <h3>Projects</h3>
                        <p>12 Active</p>
                    </div>
                </div>

                <div class="box">
                    <span class="icon">👥</span>
                    <div>
                        <h3>Students</h3>
                        <p>248 Total</p>
                    </div>
                </div>

                <div class="box">
                    <span class="icon">✅</span>
                    <div>
                        <h3>Tasks</h3>
                        <p>36 Completed</p>
                    </div>
                </div>

                <div class="box">
                    <span class="icon">📅</span>
                    <div>
                        <h3>Events</h3>
                        <p>8 Upcoming</p>
                    </div>
                </div>

                <div class="box">
                    <span class="icon">💻</span>
                    <div>
                        <h3>Courses</h3>
                        <p>15 Available</p>
                    </div>
                </div>

                <div class="box">
                    <span class="icon">⭐</span>
                    <div>
                        <h3>Rating</h3>
                        <p>4.8 / 5</p>
                    </div>
                </div>

            </div>

        </main>


        <!-- Footer -->
        <footer class="foot">
            <p>© 2026 My Dashboard | CSS Grid Project</p>
        </footer>

    </div>

</body>
</html>
